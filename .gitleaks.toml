# Gitleaks configuration for Tidalarr
# Allows test fixture data patterns that are intentionally present in test files

[extend]
useDefault = true

[allowlist]
description = "Test files, constants, CLI tools, and CI scripts"
paths = [
    '''tests/.*\.cs$''',
    '''tests/.*\.json$''',
    # CI/CD scripts
    '''\.github/.*''',
    '''scripts/.*''',
    '''.*\.ps1''',
    '''.*\.sh''',
    # CLI and test projects (development tools)
    '''TidalCLI/.*''',
    '''TidalTest/.*''',
    '''AuthTest/.*''',
    # Constants file with public API credentials
    '''src/Tidalarr/Core/Constants/.*''',
]
regexes = [
    '''user_auth_token=(test|fake|REDACTED|mock)''',
    '''test@example\.com''',
    '''user@test\.com''',
    # Public Tidal API credentials (same as Spotify public client IDs)
    '''CLIENT_ID''',
    '''CLIENT_SECRET''',
    '''CLIENT_ID_PKCE''',
    '''CLIENT_SECRET_PKCE''',
    '''clientId''',
    '''clientSecret''',
    # API key header patterns in test/doc
    '''X-Api-Key''',
]
