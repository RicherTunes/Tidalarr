# Gitleaks configuration for Tidalarr
# Tightly scoped allowlists for known-safe files

[extend]
useDefault = true

[allowlist]
description = "Specific files containing known-safe patterns"
paths = [
    # Test files with fixture data
    '''tests/.*\.cs$''',
    '''tests/.*\.json$''',

    # TidalConstants.cs - Contains Tidal public API credentials
    # (similar to Spotify public client IDs used by desktop apps)
    '''src/Tidalarr/Core/Constants/TidalConstants\.cs$''',

    # CLI development tools (not shipped in plugin)
    '''TidalCLI/TidalOAuth\.cs$''',
    '''TidalCLI/TokenStorage\.cs$''',
    '''TidalTest/Program\.cs$''',
    '''TidalTest/TokenStorage\.cs$''',
    '''AuthTest/Program\.cs$''',

    # Documentation and session notes
    '''docs/archive/.*\.md$''',
    '''docs/TECH-DEBT-INVENTORY\.md$''',
    '''SESSION_SUMMARY.*\.md$''',

    # CI/CD scripts (env var references, not actual secrets)
    '''\.github/workflows/.*\.yml$''',
    '''scripts/.*\.(ps1|sh)$''',
]
regexes = [
    # Test fixture patterns only
    '''user_auth_token=(test|fake|REDACTED|mock)''',
    '''test@example\.com''',
    '''user@test\.com''',
]
