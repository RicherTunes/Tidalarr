name: Feature Request
description: Suggest a new feature or enhancement for Tidalarr
title: "[Feature]: "
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea clearly.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and this feature hasn't been requested
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Category
      options:
        - Download/Indexer Enhancement
        - Quality/Metadata Improvement
        - Performance Optimization
        - User Interface/Configuration
        - OAuth/Authentication
        - Other
    validations:
      required: true
