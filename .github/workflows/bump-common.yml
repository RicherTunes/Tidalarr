name: Bump Common Submodule

on:
  workflow_dispatch: {}
  schedule:
    # Run daily at 2:13 AM UTC (after Common nightly, before our nightly)
    - cron: '13 2 * * *'

jobs:
  bump:
    uses: RicherTunes/Lidarr.Plugin.Common/.github/workflows/bump-common-plugin.yml@main
    # TODO: replace @main with merge-commit SHA after PR #514 merges
    # Quality upgrades absorbed from reusable workflow:
    #   - ubuntu-latest runner (was windows-latest, PS-only)
    #   - build verify with conditional assembly extraction (was none)
    #   - concurrency guard (was none)
    #   - actions/checkout@v6 (was @v4)
    #   - actions/setup-dotnet@v5 (was absent — no build verify at all)
    with:
      plugin_csproj: src/Tidalarr/Tidalarr.csproj
      solution_file: Tidalarr.sln
      lidarr_path_msbuild_prop: LidarrPath
      include_build_verify: true
      extract_script_path: scripts/extract-lidarr-assemblies.sh
    secrets:
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
