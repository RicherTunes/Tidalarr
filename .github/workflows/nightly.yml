name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly (full build + CLI tests)
    # ubuntu + real Lidarr host assemblies (Docker), matching test-and-coverage.yml /
    # ci.yml. The previous windows-latest runner could not extract the Linux hotio
    # image, so ci.ps1 fell back to -SkipHostBridge stub mode, which excludes the
    # LidarrNative host-bridge folder — TidalModule.cs still uses it, so every nightly
    # broke with CS0234. Using the same technique as the working builds fixes it and
    # keeps the nightly's extra coverage (CLI-scope tests + packaging).
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Init Common submodule only
        shell: bash
        run: |
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Install PowerShell (pwsh)
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          CODENAME=${VERSION_CODENAME:-"jammy"}
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$CODENAME/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb \
            || curl -fsSL "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Lidarr host assemblies (Docker, plugins branch)
        shell: bash
        run: |
          set -e
          mkdir -p ext/Lidarr/_output/net8.0
          if ! docker --version >/dev/null 2>&1; then echo "::error::Docker required to fetch Lidarr host assemblies"; exit 1; fi
          IMAGE="ghcr.io/hotio/lidarr:pr-plugins-3.1.2.4913"
          n=0; until [ "$n" -ge 3 ]; do docker pull "$IMAGE" && break; n=$((n+1)); echo "pull failed ($n), retry in 10s"; sleep 10; done
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/app" ext/Lidarr/_extracted || docker cp "$cid:/opt/lidarr" ext/Lidarr/_extracted
          docker rm "$cid" >/dev/null
          find ext/Lidarr/_extracted -type f -name "*.dll" -exec cp {} ext/Lidarr/_output/net8.0 \;
          test -f ext/Lidarr/_output/net8.0/Lidarr.dll || { echo "::error::Lidarr.dll missing after extraction"; exit 1; }
          echo "Extracted $(ls ext/Lidarr/_output/net8.0/*.dll | wc -l) host assemblies"

      - name: Run pipeline incl. CLI tests (full build, real host assemblies)
        shell: pwsh
        run: ./scripts/ci.ps1 -IncludeCliTests -UseRealHostAssemblies
