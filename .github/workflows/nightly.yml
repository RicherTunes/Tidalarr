name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x

      - name: Run pipeline incl. CLI tests
        shell: pwsh
        run: ./scripts/ci.ps1 -IncludeCliTests

