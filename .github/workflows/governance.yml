name: Governance

on:
  schedule:
    # Weekly Monday 7 AM UTC
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  allowlist-expiration:
    name: Allowlist Expiration Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check allowlist expirations
      shell: bash
      run: |
        set -euo pipefail
        TODAY=$(date -u +%Y-%m-%d)
        echo "Today: $TODAY"

        cat > /tmp/check_expiry.py << 'PYEOF'
        import json, sys, os

        today = os.environ["TODAY"]
        filepath = sys.argv[1]

        with open(filepath) as fh:
            data = json.load(fh)

        entries = data.get("entries", [])
        expired = []

        for i, e in enumerate(entries):
            exp = e.get("expiresOn", "")
            if not exp:
                continue
            status = "EXPIRED" if exp < today else "OK     "
            label = "file=" + e.get("file", "") + "  reason=" + e.get("reason", "")
            print("%s [%d]: expiresOn=%s  %s" % (status, i, exp, label))
            if exp < today:
                expired.append(i)

        if expired:
            sys.exit(1)
        PYEOF

        FAILED=0

        for f in .github/sha-pin-allowlist.json; do
          if [ ! -f "$f" ]; then
            echo "Skipping $f (not found)"
            continue
          fi

          echo ""
          echo "=== Checking $f ==="
          TODAY="$TODAY" python3 /tmp/check_expiry.py "$f" || FAILED=1
        done

        if [ "$FAILED" -ne 0 ]; then
          echo ""
          echo "::error::One or more allowlist entries have expired. Please renew or remove them."
          exit 1
        fi

        echo ""
        echo "All allowlist entries are current."

  quarantine-visibility:
    name: Quarantined Test Visibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Init Common submodule only
      shell: bash
      run: |
        git config --local url.https://github.com/.insteadOf git@github.com:
        git submodule sync -- ext/Lidarr.Plugin.Common
        git submodule update --init --depth=1 -- ext/Lidarr.Plugin.Common

    - name: Assert Common submodule initialized
      shell: bash
      run: |
        if [ ! -d "ext/Lidarr.Plugin.Common/scripts" ]; then
          echo "::error::FATAL: ext/Lidarr.Plugin.Common/scripts not found - submodule not initialized"
          exit 1
        fi
        SHA=$(git -C ext/Lidarr.Plugin.Common rev-parse --short HEAD 2>/dev/null || echo "<unknown>")
        echo "Common submodule initialized at $SHA"

    - name: Install PowerShell (pwsh)
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        CODENAME=${VERSION_CODENAME:-"jammy"}
        curl -fsSL "https://packages.microsoft.com/config/ubuntu/$CODENAME/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb \
          || curl -fsSL "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y powershell

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Prepare host stub assemblies
      shell: pwsh
      run: |
        $commonScripts = Join-Path $PWD 'ext/Lidarr.Plugin.Common/scripts'
        $hostOutput = Join-Path $PWD 'ext/Lidarr/_output/net8.0'
        if (Test-Path $commonScripts) {
          $prepareStub = Join-Path $commonScripts 'prepare-host-stub.ps1'
          if (Test-Path $prepareStub) {
            Write-Host "Generating host stub assemblies..."
            & $prepareStub -OutputPath $hostOutput
          }
        }

    - name: Restore and build
      shell: bash
      run: |
        dotnet restore src/Tidalarr/Tidalarr.csproj
        dotnet build src/Tidalarr/Tidalarr.csproj --configuration Release --no-restore \
          -p:RunAnalyzersDuringBuild=false -p:EnableNETAnalyzers=false

    - name: Build test project (exclude HostBridge)
      shell: bash
      run: |
        dotnet build tests/Tidalarr.Tests/Tidalarr.Tests.csproj \
          --configuration Release -v minimal \
          -p:RunAnalyzersDuringBuild=false -p:EnableNETAnalyzers=false \
          -p:SkipHostBridge=true -p:ExcludeHostBridge=true

    - name: Run quarantined tests (visibility)
      continue-on-error: true
      shell: bash
      run: |
        dotnet test tests/Tidalarr.Tests/Tidalarr.Tests.csproj \
          --configuration Release --no-build \
          --verbosity normal \
          --filter "State=Quarantined" \
          --blame-hang-timeout 60s \
          --logger "trx;LogFileName=quarantined.trx" \
          --results-directory ./TestResults \
          -p:PluginPackagingDisable=true \
          -p:SkipHostBridge=true

    - name: Report quarantine count
      if: always()
      shell: bash
      run: |
        COUNT=0
        if [ -d TestResults ]; then
          COUNT=$(grep -r '<UnitTestResult' TestResults/ 2>/dev/null | wc -l || echo 0)
        fi
        echo "## Quarantined Tests: $COUNT" >> "$GITHUB_STEP_SUMMARY"
        echo "Quarantined test count: $COUNT"

    - name: Upload quarantine results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: governance-quarantine-results
        path: ./TestResults/*.trx
        retention-days: 7
