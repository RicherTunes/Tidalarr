name: Security Scanning

on:
  push:
    branches: [main, develop, feat/cli-arg-hardening]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3 AM

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build for Analysis
        shell: pwsh
        run: |
          # Build only the main plugin project (HostBridge requires real Lidarr assemblies not available in CI)
          dotnet restore src/Tidalarr/Tidalarr.csproj
          dotnet build src/Tidalarr/Tidalarr.csproj -c Release --no-restore -p:RunAnalyzersDuringBuild=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency Vulnerabilities
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | Tee-Object -Variable output
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable dependencies found!"
            exit 1
          }
        shell: pwsh
        continue-on-error: true

      - name: Report vulnerabilities
        if: failure()
        run: |
          echo "::warning::Vulnerable dependencies detected. Please review and update."
