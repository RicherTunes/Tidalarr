name: Test and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install PowerShell (pwsh)
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          CODENAME=${VERSION_CODENAME:-"jammy"}
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$CODENAME/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb \
            || curl -fsSL "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare host stub assemblies
        shell: pwsh
        run: |
          $commonScripts = Join-Path $PWD 'ext/Lidarr.Plugin.Common/scripts'
          $hostOutput = Join-Path $PWD 'ext/Lidarr/_output/net6.0'
          if (Test-Path $commonScripts) {
            $prepareStub = Join-Path $commonScripts 'prepare-host-stub.ps1'
            if (Test-Path $prepareStub) {
              Write-Host "Generating host stub assemblies..."
              & $prepareStub -OutputPath $hostOutput
            }
          }

      - name: Restore and build
        shell: bash
        run: |
          dotnet restore src/Tidalarr/Tidalarr.csproj
          dotnet build src/Tidalarr/Tidalarr.csproj --configuration Release --no-restore \
            -p:RunAnalyzersDuringBuild=false -p:EnableNETAnalyzers=false

      - name: Build tests
        shell: bash
        run: |
          dotnet restore tests/Tidalarr.Tests/Tidalarr.Tests.csproj -p:SkipHostBridge=true
          dotnet build tests/Tidalarr.Tests/Tidalarr.Tests.csproj --configuration Release --no-restore \
            -p:SkipHostBridge=true -p:RunAnalyzersDuringBuild=false -p:EnableNETAnalyzers=false

      - name: Run tests with coverage
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet test tests/Tidalarr.Tests/Tidalarr.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect "XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults/ \
            --filter "scope!=cli" \
            -p:SkipHostBridge=true

      - name: Install ReportGenerator
        shell: bash
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage summary
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          COV=$(find TestResults -name "coverage.cobertura.xml" -type f | head -1)
          if [ -n "$COV" ] && [ -f "$COV" ]; then
            reportgenerator \
              -reports:"$COV" \
              -targetdir:"coverage-report" \
              -reporttypes:"MarkdownSummary;HtmlInline_AzurePipelines"
            echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            cat coverage-report/Summary.md >> $GITHUB_STEP_SUMMARY || true
          else
            echo "No coverage file found"
          fi

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            coverage-report/**
          retention-days: 14
