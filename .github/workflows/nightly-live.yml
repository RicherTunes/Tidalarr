name: Nightly Live

on:
  schedule:
    - cron: '20 3 * * *'  # 03:20 UTC daily -- staggered across ecosystem (Brainarr+20m)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate Credentials
    runs-on: ubuntu-latest
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check for Tidal credentials
        id: check
        env:
          # Secret values for placeholder detection; GitHub auto-masks in logs
          CLIENT_ID_VAL: ${{ secrets.TIDAL_CLIENT_ID }}
          TOKEN_VAL: ${{ secrets.TIDAL_ACCESS_TOKEN }}
        run: |
          is_valid() {
            local val="$1"
            [[ -z "$val" ]] && return 1
            local lower="${val,,}"
            case "$lower" in
              changeme*|todo*|example*|placeholder*|xxx*|test123*|your_*|your-*|insert*|replace*) return 1 ;;
            esac
            [[ ${#val} -lt 10 ]] && return 1
            return 0
          }

          has_cred="false"
          if is_valid "$CLIENT_ID_VAL"; then
            has_cred="true"
            echo "::notice::TIDAL_CLIENT_ID validated"
          elif [[ -n "$CLIENT_ID_VAL" ]]; then
            echo "::warning::TIDAL_CLIENT_ID looks like a placeholder; not counting"
          fi

          if is_valid "$TOKEN_VAL"; then
            has_cred="true"
            echo "::notice::TIDAL_ACCESS_TOKEN validated"
          elif [[ -n "$TOKEN_VAL" ]]; then
            echo "::warning::TIDAL_ACCESS_TOKEN looks like a placeholder; not counting"
          fi

          if [[ "$has_cred" == "true" ]]; then
            echo "has-credentials=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tidal credentials validated; live tests will run"
          else
            echo "has-credentials=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No valid Tidal credentials found; skipping live tests. Set TIDAL_CLIENT_ID or TIDAL_ACCESS_TOKEN."
          fi

  live-tests:
    name: Live Tidal API Tests
    runs-on: windows-latest
    needs: gate
    if: needs.gate.outputs.has-credentials == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Prepare host stub assemblies
        shell: pwsh
        run: |
          $commonScripts = Join-Path $PWD 'ext/Lidarr.Plugin.Common/scripts'
          $hostOutput = Join-Path $PWD 'ext/Lidarr/_output/net8.0'
          if (-not (Test-Path $commonScripts)) {
            throw "Common scripts not found at $commonScripts"
          }
          & (Join-Path $commonScripts 'prepare-host-stub.ps1') -OutputPath $hostOutput

      - name: Restore solution
        shell: pwsh
        run: dotnet restore Tidalarr.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build Tidalarr.sln -c Release --no-restore `
            -p:PluginPackagingDisable=true `
            -p:SkipHostBridge=true `
            -p:ExcludeHostBridge=true `
            -v minimal

      - name: Build test project
        shell: pwsh
        run: |
          $testProj = Join-Path $PWD 'tests/Tidalarr.Tests/Tidalarr.Tests.csproj'
          dotnet build $testProj -c Release --no-restore -v minimal `
            -p:RunAnalyzersDuringBuild=false `
            -p:EnableNETAnalyzers=false `
            -p:TreatWarningsAsErrors=false `
            -p:SkipHostBridge=true `
            -p:ExcludeHostBridge=true `
            -p:PluginPackagingDisable=true

      - name: Run live integration tests
        id: run-tests
        shell: pwsh
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
          TIDAL_ACCESS_TOKEN: ${{ secrets.TIDAL_ACCESS_TOKEN }}
        run: |
          $testProj = Join-Path $PWD 'tests/Tidalarr.Tests/Tidalarr.Tests.csproj'
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null

          $output = dotnet test $testProj `
            --configuration Release `
            --no-build `
            --filter "Area=E2E/Live|Category=LiveIntegration" `
            --logger "trx;LogFileName=live-test-results.trx" `
            --results-directory ./TestResults `
            2>&1

          $exitCode = $LASTEXITCODE
          $output | Out-File -FilePath TestResults/live-service.log -Encoding utf8
          $output | Write-Host

          # Detect zero-test scenario
          $zeroTests = "false"
          if ($output -match "No test matches the given testcase filter|No test is available") {
            $zeroTests = "true"
          }

          # Parse counts
          $total = 0; $failed = 0
          if ($output -match 'Total tests:\s*(\d+)') { $total = [int]$Matches[1] }
          if ($output -match 'Failed:\s*(\d+)') { $failed = [int]$Matches[1] }
          if ($total -eq 0) { $zeroTests = "true" }

          # Count inconclusive (rate-limited) tests
          $inconclusive = ([regex]::Matches(($output -join "`n"), '\[INCONCLUSIVE:RATE_LIMITED\]')).Count

          echo "test-exit-code=$exitCode" >> $env:GITHUB_OUTPUT
          echo "test-total=$total" >> $env:GITHUB_OUTPUT
          echo "test-failed=$failed" >> $env:GITHUB_OUTPUT
          echo "test-inconclusive=$inconclusive" >> $env:GITHUB_OUTPUT
          echo "zero-tests=$zeroTests" >> $env:GITHUB_OUTPUT

          Write-Host "::notice::Test results: total=$total failed=$failed inconclusive=$inconclusive exit=$exitCode zero=$zeroTests"

      - name: Guard — fail if secrets present but 0 tests ran
        if: steps.run-tests.outputs.zero-tests == 'true'
        shell: pwsh
        run: |
          Write-Host "::error::Secrets configured but 0 live tests executed. Add tests with [Trait('Area', 'E2E/Live')] or [Trait('Category', 'LiveIntegration')]."
          exit 1

      - name: Warn if tests were inconclusive (rate-limited)
        if: steps.run-tests.outputs.test-inconclusive != '0' && steps.run-tests.outputs.test-inconclusive != ''
        shell: pwsh
        run: |
          Write-Host "::warning::${{ steps.run-tests.outputs.test-inconclusive }} test(s) were rate-limited and classified as inconclusive. If this persists nightly, check credential quotas or rate limits."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-live-test-results
          path: ./TestResults/
          if-no-files-found: ignore
          retention-days: 14

  notify-failures:
    name: Track Consecutive Failures
    needs: live-tests
    if: always() && needs.live-tests.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Check for 3 consecutive failures
        uses: actions/github-script@v8
        with:
          script: |
            // Get default branch for scoping
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const defaultBranch = repo.default_branch;

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'nightly-live.yml', status: 'completed',
              branch: defaultBranch, per_page: 4,
            });
            const previous = runs.workflow_runs.slice(1, 4);
            const consecutiveFailures = previous.filter(r => r.conclusion === 'failure').length;
            console.log(`Branch: ${defaultBranch}`);
            console.log(`Previous ${previous.length} runs: ${previous.map(r => `${r.event}:${r.conclusion}`).join(', ')}`);

            if (consecutiveFailures >= 2) {
              const title = 'Nightly live tests: 3+ consecutive failures';
              const currentRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = [
                '## Nightly Live Test Failures',
                '',
                `Failed **${consecutiveFailures + 1} consecutive times** on \`${defaultBranch}\`.`,
                '',
                '### Recent runs',
                ...previous.map(r => `- ${r.created_at}: **${r.conclusion}** ([run](${r.html_url}))`),
                `- ${new Date().toISOString().split('T')[0]}: **failure** ([current](${currentRunUrl}))`,
                '',
                '### Action needed',
                '- Check if Tidal credentials are still valid',
                '- Check if Tidal API has changed',
                '- Check if test filter or build is misconfigured',
                '',
                `> Auto-created by nightly-live workflow. Scoped to \`${defaultBranch}\` branch.`,
              ].join('\n');

              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'ci,nightly-live',
              });
              const existing = issues.find(i => i.title === title);

              if (existing) {
                const recentConclusions = previous.map(r => r.conclusion).join(' → ');
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still failing as of ${new Date().toISOString().split('T')[0]}.\n\n**Current run**: [#${context.runNumber}](${currentRunUrl})\n**Last 3**: ${recentConclusions}\n**Total consecutive**: ${consecutiveFailures + 1}`,
                });
                console.log(`Updated existing issue #${existing.number}`);
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ['ci', 'nightly-live'],
                });
                console.log('Created new tracking issue');
              }
            } else {
              console.log('Not enough consecutive failures yet — no issue needed');
            }
