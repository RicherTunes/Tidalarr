# Caller workflow for Common's reusable packaging gates
# Provides: Canonical Abstractions, MAN004 escalation, Entrypoint validation, Parity lint
name: Packaging Gates

on:
  schedule:
    - cron: '30 4 * * *'  # 04:30 UTC daily — nightly packaging verification
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'plugin.json'
      - 'ext/Lidarr.Plugin.Common/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'plugin.json'
      - 'ext/Lidarr.Plugin.Common/**'
  workflow_dispatch:

jobs:
  packaging-gates:
    uses: RicherTunes/Lidarr.Plugin.Common/.github/workflows/packaging-gates.yml@b9492e87502cfe93ec90709b387aea5bb079c698
    with:
      common-path: ext/Lidarr.Plugin.Common
      plugin-csproj: src/Tidalarr/Tidalarr.csproj
      manifest-path: plugin.json
      plugin-load-gate: true
    secrets:
      submodules-token: ${{ secrets.CROSS_REPO_PAT }}
