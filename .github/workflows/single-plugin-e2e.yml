name: ✅ Single-Plugin E2E Gate (Tidalarr)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'build.ps1'
      - 'build/**'
      - 'tools/**'
      - 'scripts/**'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'NuGet.config'
      - 'plugin.json'
      - 'manifest.json'
      - 'ext/**'
      - 'ext-common-sha.txt'
      - '.github/workflows/single-plugin-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'build.ps1'
      - 'build/**'
      - 'tools/**'
      - 'scripts/**'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'NuGet.config'
      - 'plugin.json'
      - 'manifest.json'
      - 'ext/**'
      - 'ext-common-sha.txt'
      - '.github/workflows/single-plugin-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    name: ✅ Single-Plugin E2E (Schema Gate)
    uses: RicherTunes/Lidarr.Plugin.Common/.github/workflows/multi-plugin-smoke-test.yml@4e96186ed12a2098312a8cb709c4a8a8e3b0bef7
    with:
      test_plugins: 'tidalarr'
      caller_plugin: 'tidalarr'
      lidarr_tag: 'pr-plugins-3.1.2.4913'
      # For PRs, prefer the head commit SHA (merge commits may not be fetchable by cross-repo checkout).
      tidalarr_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # Credless baseline: schema-only by default. Flip these to true only when secrets exist.
      run_medium_gate: false
      run_downloadclient_gate: false
      run_search_gate: false
      run_grab_gate: false
    secrets: inherit

