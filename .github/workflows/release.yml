name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: RicherTunes/Lidarr.Plugin.Common/.github/workflows/release-plugin.yml@c2aca69b8c94bbba2ff9a4884291f0cc501eb623
    # TODO: replace @main with merge-commit SHA after PR #514 merges
    with:
      plugin_name: Lidarr.Plugin.Tidalarr
      plugin_dll: Lidarr.Plugin.Tidalarr.dll
      main_csproj: src/Tidalarr/Tidalarr.csproj
      lidarr_path_msbuild_prop: LidarrPath
      # Tidalarr's csproj sets OutputPath=bin\ + AppendTargetFrameworkToOutputPath=false
      # so the merged DLL lands at src/Tidalarr/bin/ (not bin/Release/net8.0/).
      dll_search_dirs: 'src/Tidalarr/bin:src/Tidalarr/bin/Release/net8.0'
      minimum_lidarr_version: '3.0.0.4855'
      include_cosign: true
      include_sbom: true
      version: ${{ inputs.version || '' }}
      draft: ${{ inputs.draft || false }}
    secrets:
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
