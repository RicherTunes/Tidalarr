name: Packaging Closure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: packaging-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package-closure:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (no submodules)
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: false
          persist-credentials: false

      - name: Init required submodule (Common only)
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git config --local url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadOf https://github.com/
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common
          if (-not (Test-Path 'ext/Lidarr.Plugin.Common/src/Lidarr.Plugin.Common.csproj')) { Write-Error 'Common submodule not initialized'; exit 1 }
          # Cleanup rewrite rules (ephemeral runner hygiene)
          git config --local --get-all url.https://github.com/.insteadof | Out-Null
          if ($LASTEXITCODE -eq 0) { git config --local --unset-all url.https://github.com/.insteadof }
          git config --local --get-all url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadof | Out-Null
          if ($LASTEXITCODE -eq 0) { git config --local --unset-all url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadof }

      - name: Setup .NET
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Formatting check (repo-only)
        shell: pwsh
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet format Tidalarr.sln --verify-no-changes -v minimal --exclude ext --exclude temp

      - name: Build (Release)
        shell: pwsh
        run: |
          # Build only plugin projects, exclude HostBridge which requires full Lidarr assemblies
          dotnet build src/Tidalarr/Tidalarr.csproj -c Release -v minimal `
            -p:RunAnalyzersDuringBuild=false `
            -p:EnableNETAnalyzers=false `
            -p:TreatWarningsAsErrors=false
          dotnet build TidalCLI/TidalCLI.csproj -c Release -v minimal `
            -p:RunAnalyzersDuringBuild=false `
            -p:EnableNETAnalyzers=false `
            -p:TreatWarningsAsErrors=false

      - name: Verify dependency closure
        shell: pwsh
        run: |
          # Verify from build output (ILRepack packaging not available in CI)
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'src/Tidalarr/bin/Release/net8.0'
          if (-not (Test-Path $outputDir)) { Write-Error "Build output not found: $outputDir"; exit 1 }
          $dlls = Get-ChildItem $outputDir -Filter *.dll | ForEach-Object { $_.Name }
          $allowed = @('Lidarr.Plugin.Tidalarr.dll','Lidarr.Plugin.Common.dll','Lidarr.Plugin.Abstractions.dll')
          $disallowed = $dlls | Where-Object { $_ -like 'Lidarr.*' -and -not ($allowed -contains $_) }
          if ($disallowed) { Write-Error "Disallowed host assemblies found: $($disallowed -join ', ')"; exit 1 }
          Write-Host "Dependency closure OK. Assemblies: $($dlls -join ', ')"

      - name: Verify artifact freshness (stale artifact guard)
        shell: pwsh
        run: |
          # Prevent false-greens from stale build artifacts
          $pluginDll = Join-Path $env:GITHUB_WORKSPACE 'src/Tidalarr/bin/Release/net8.0/Lidarr.Plugin.Tidalarr.dll'
          if (-not (Test-Path $pluginDll)) { Write-Error "Plugin DLL not found: $pluginDll"; exit 1 }

          $dllInfo = Get-Item $pluginDll
          $buildTime = $dllInfo.LastWriteTimeUtc
          $now = [DateTime]::UtcNow
          $ageMinutes = ($now - $buildTime).TotalMinutes

          Write-Host "Plugin DLL: $($dllInfo.Name)"
          Write-Host "Build time: $buildTime UTC"
          Write-Host "Artifact age: $([math]::Round($ageMinutes, 2)) minutes"

          # Artifact should be less than 10 minutes old (generous for slow runners)
          if ($ageMinutes -gt 10) {
            Write-Error "STALE ARTIFACT DETECTED! DLL is $([math]::Round($ageMinutes, 2)) minutes old."
            Write-Error "This suggests testing a cached/stale artifact instead of fresh build."
            Write-Error "Build time: $buildTime UTC | Current time: $now UTC"
            exit 1
          }

          # Verify assembly version metadata matches expected format
          try {
            $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($pluginDll)
            Write-Host "Assembly version: $($assemblyName.Version)"
            Write-Host "[OK] Artifact freshness verified - built within last $([math]::Round($ageMinutes, 2)) minutes"
          } catch {
            Write-Error "Failed to read assembly metadata: $_"
            exit 1
          }

      - name: Run Packaging Tests
        shell: pwsh
        env:
          REQUIRE_PACKAGE_TESTS: 'true'
          PLUGIN_ASSEMBLY_PATH: ${{ github.workspace }}/src/Tidalarr/bin/Release/net8.0/Lidarr.Plugin.Tidalarr.dll
        run: |
          dotnet test tests/Tidalarr.Tests/Tidalarr.Tests.csproj `
            --configuration Release `
            --no-restore `
            --filter "Category=Packaging|Category=LibraryLinking" `
            --logger "console;verbosity=normal" `
            -p:PluginPackagingDisable=true `
            -p:RunAnalyzersDuringBuild=false -p:EnableNETAnalyzers=false -p:TreatWarningsAsErrors=false

      - name: Upload build artifacts
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-build
          path: |
            src/Tidalarr/bin/Release/net8.0/Lidarr.Plugin.Tidalarr.dll
            src/Tidalarr/bin/Release/net8.0/Lidarr.Plugin.Tidalarr.pdb
            src/Tidalarr/bin/Release/net8.0/Lidarr.Plugin.Common.dll
            plugin.json


