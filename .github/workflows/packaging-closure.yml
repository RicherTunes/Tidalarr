name: Packaging Closure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: packaging-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package-closure:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Init required submodule (Common only)
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git config --local url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadOf https://github.com/
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common
          if (-not (Test-Path 'ext/Lidarr.Plugin.Common/src/Lidarr.Plugin.Common.csproj')) { Write-Error 'Common submodule not initialized'; exit 1 }
          # Cleanup rewrite rules (ephemeral runner hygiene)
          git config --local --get-all url.https://github.com/.insteadof | Out-Null
          if ($LASTEXITCODE -eq 0) { git config --local --unset-all url.https://github.com/.insteadof }
          git config --local --get-all url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadof | Out-Null
          if ($LASTEXITCODE -eq 0) { git config --local --unset-all url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadof }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Formatting check (repo-only)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet format Tidalarr.sln --verify-no-changes -v minimal --exclude ext --exclude temp

      - name: Build (Release)
        shell: pwsh
        run: dotnet build Tidalarr.sln -c Release -v minimal

      - name: Package plugin (net6.0)
        shell: pwsh
        run: ./build.ps1 -Package -Configuration Release

      - name: Verify dependency closure
        shell: pwsh
        run: |
          $packagesDir = Join-Path $env:GITHUB_WORKSPACE 'src/Tidalarr/artifacts/packages'
          if (-not (Test-Path $packagesDir)) { Write-Error "Packages directory not found: $packagesDir"; exit 1 }
          $zip = Get-ChildItem $packagesDir -Filter *.zip | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $zip) { Write-Error "No package zip found under $packagesDir"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $dlls = $archive.Entries | Where-Object { $_.FullName.ToLower().EndsWith('.dll') } | ForEach-Object { $_.Name }
          } finally { $archive.Dispose() }
          $allowed = @('Lidarr.Plugin.Tidalarr.dll','Lidarr.Plugin.Common.dll')
          $disallowed = $dlls | Where-Object { $_ -like 'Lidarr.*' -and -not ($allowed -contains $_) }
          if ($disallowed) { Write-Error "Disallowed host assemblies found: $($disallowed -join ', ')"; exit 1 }
          Write-Host "Dependency closure OK. Assemblies: $($dlls -join ', ')"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: src/Tidalarr/artifacts/packages/*.zip
