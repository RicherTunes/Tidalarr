name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      use_submodule:
        description: 'Use submodule instead of NuGet packages (dev escape hatch)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

# Environment variable for NuGet package mode (can be overridden by workflow_dispatch)
env:
  USE_NUGET_PACKAGES: ${{ github.event.inputs.use_submodule == 'true' && 'false' || 'true' }}

jobs:
  parity-lint:
    name: Parity Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init Common submodule
        shell: bash
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Assert Common submodule initialized
        shell: bash
        run: |
          if [ ! -d "ext/Lidarr.Plugin.Common/scripts" ]; then
            echo "::error::FATAL: ext/Lidarr.Plugin.Common/scripts not found - submodule not initialized"
            exit 1
          fi
          SHA=$(git -C ext/Lidarr.Plugin.Common rev-parse --short HEAD 2>/dev/null || echo "<unknown>")
          echo "✓ Common submodule initialized at $SHA"
          if [ -f ext-common-sha.txt ]; then
            EXPECTED=$(cat ext-common-sha.txt | tr -d '\n\r ' | cut -c1-7)
            if [ -n "$EXPECTED" ] && [ "$SHA" != "<unknown>" ] && [ "${SHA:0:7}" != "$EXPECTED" ]; then
              echo "::warning::Submodule SHA ($SHA) differs from pinned ($EXPECTED)"
            fi
          fi

      - name: Show Common submodule SHA
        run: |
          echo "=== Submodule status ==="
          git submodule status ext/Lidarr.Plugin.Common
          echo ""
          if [ -f ext-common-sha.txt ]; then
            echo "=== ext-common-sha.txt ==="
            cat ext-common-sha.txt
          fi

      - name: Run Parity Lint
        shell: pwsh
        run: |
          $script = "ext/Lidarr.Plugin.Common/scripts/parity-lint.ps1"
          if (-not (Test-Path $script)) {
            Write-Error "FATAL: parity-lint.ps1 not found at $script - submodule likely not initialized"
            exit 1
          }
          & $script -Mode ci -RepoPath .

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: false

      - name: Init required submodule (Common only)
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Assert Common submodule initialized
        shell: bash
        run: |
          if [ ! -d "ext/Lidarr.Plugin.Common/scripts" ]; then
            echo "::error::FATAL: ext/Lidarr.Plugin.Common/scripts not found - submodule not initialized"
            exit 1
          fi
          SHA=$(git -C ext/Lidarr.Plugin.Common rev-parse --short HEAD 2>/dev/null || echo "<unknown>")
          echo "✓ Common submodule initialized at $SHA"
          if [ -f ext-common-sha.txt ]; then
            EXPECTED=$(cat ext-common-sha.txt | tr -d '\n\r ' | cut -c1-7)
            if [ -n "$EXPECTED" ] && [ "$SHA" != "<unknown>" ] && [ "${SHA:0:7}" != "$EXPECTED" ]; then
              echo "::warning::Submodule SHA ($SHA) differs from pinned ($EXPECTED)"
            fi
          fi

      - name: Setup .NET SDKs
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # HARD GATE: Verify NuGet packages are available (no silent fallback to submodule)
      # Skipped when use_submodule=true (workflow_dispatch escape hatch)
      - name: Verify NuGet package availability
        if: env.USE_NUGET_PACKAGES == 'true'
        shell: pwsh
        run: |
          Write-Host "Verifying NuGet packages are available (UseNuGetPackages=true)"
          Write-Host "To use submodule instead, trigger workflow_dispatch with use_submodule=true"
          Write-Host ""

          $requiredPackages = @(
            @{ Id = 'Lidarr.Plugin.Abstractions'; Version = '1.5.0' },
            @{ Id = 'Lidarr.Plugin.Common'; Version = '1.5.0' }
          )
          $allAvailable = $true
          $missing = @()
          $apiErrors = @()

          foreach ($pkg in $requiredPackages) {
            $packageId = $pkg.Id
            $expectedVersion = $pkg.Version
            $url = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json"
            try {
              $response = Invoke-RestMethod -Uri $url -ErrorAction Stop
              $available = $response.versions -contains $expectedVersion
              if ($available) {
                Write-Host "✓ $packageId $expectedVersion available"
              } else {
                $recentVersions = if ($response.versions.Count -gt 5) { $response.versions[-5..-1] -join ', ' } else { $response.versions -join ', ' }
                Write-Host "✗ $packageId $expectedVersion NOT FOUND (available: $recentVersions)"
                $allAvailable = $false
                $missing += "$packageId@$expectedVersion"
              }
            } catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              if ($statusCode -eq 404) {
                Write-Host "✗ $packageId not published to NuGet.org (404 Not Found)"
                $allAvailable = $false
                $missing += "$packageId@$expectedVersion"
              } elseif ($statusCode -eq 429) {
                Write-Host "⚠ $packageId - NuGet.org rate limited (429). Retry later."
                $apiErrors += "$packageId (rate limited)"
              } elseif ($statusCode) {
                Write-Host "⚠ $packageId - NuGet.org returned HTTP $statusCode"
                $apiErrors += "$packageId (HTTP $statusCode)"
              } else {
                Write-Host "⚠ $packageId - Network error: $($_.Exception.Message)"
                $apiErrors += "$packageId (network error)"
              }
            }
          }

          # Fail differently for API errors vs missing packages
          if ($apiErrors.Count -gt 0) {
            Write-Host ""
            Write-Host "::error::NUGET API ERROR: Could not verify packages: $($apiErrors -join ', ')"
            Write-Host "::error::This may be a transient NuGet.org issue. Please retry the workflow."
            exit 1
          }

          if (-not $allAvailable) {
            Write-Host ""
            Write-Host "::error::HARD GATE FAILED: Required NuGet packages not available: $($missing -join ', ')"
            Write-Host "::error::CI cannot proceed with UseNuGetPackages=true until packages are published."
            Write-Host "::error::For local development, use workflow_dispatch with use_submodule=true"
            exit 1
          }

          Write-Host ""
          Write-Host "✓ All required NuGet packages available"

      - name: Show build mode
        shell: pwsh
        run: |
          if ($env:USE_NUGET_PACKAGES -eq 'true') {
            Write-Host "::notice::Building with NuGet packages (UseNuGetPackages=true)"
          } else {
            Write-Host "::notice::Building with submodule (escape hatch active)"
          }

      - name: Formatting check (repo-only)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet format Tidalarr.sln --verify-no-changes -v minimal --exclude ext --exclude temp

      - name: Run unified plugin pipeline (submodule mode)
        if: env.USE_NUGET_PACKAGES != 'true'
        shell: pwsh
        run: |
          Write-Host "Running CI with submodule (UseInRepoCommon=true)"
          ./scripts/ci.ps1

      - name: Build with NuGet packages
        if: env.USE_NUGET_PACKAGES == 'true'
        shell: pwsh
        run: |
          Write-Host "Building with UseNuGetPackages=true"
          # Prepare host stub assemblies (still needed for Lidarr references)
          $commonScripts = Join-Path $PWD 'ext/Lidarr.Plugin.Common/scripts'
          $hostOutput = Join-Path $PWD 'ext/Lidarr/_output/net8.0'
          if (-not (Test-Path $hostOutput) -or -not (Get-ChildItem -Path $hostOutput -Filter *.dll -File -ErrorAction SilentlyContinue)) {
            Write-Host "Generating host stub assemblies" -ForegroundColor Cyan
            & (Join-Path $commonScripts 'prepare-host-stub.ps1') -OutputPath $hostOutput
          }
          # Restore and build with NuGet packages
          dotnet restore Tidalarr.sln -p:UseNuGetPackages=true
          dotnet build src/Tidalarr/Tidalarr.csproj -c Release -p:UseNuGetPackages=true --no-restore
          # Verify plugin manifest
          & ./scripts/verify-plugin.ps1

  # ═══════════════════════════════════════════════════════════════════════════
  # REDUNDANT CANARY: Keep for one release cycle after NuGet default is merged
  # This job validates the NuGet path independently on Linux + Windows.
  # Can be removed once the main build job has proven stable with NuGet packages.
  # ═══════════════════════════════════════════════════════════════════════════
  nuget-package-path:
    name: NuGet Package Path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init Common submodule (for build targets only)
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check NuGet package availability
        id: check-nuget
        shell: pwsh
        run: |
          # Check if ALL required packages are available on NuGet.org
          $requiredPackages = @(
            @{ Id = 'Lidarr.Plugin.Abstractions'; Version = '1.5.0' },
            @{ Id = 'Lidarr.Plugin.Common'; Version = '1.5.0' }
          )
          $allAvailable = $true
          foreach ($pkg in $requiredPackages) {
            $packageId = $pkg.Id
            $expectedVersion = $pkg.Version
            try {
              $response = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json" -ErrorAction Stop
              $available = $response.versions -contains $expectedVersion
              if ($available) {
                Write-Host "✓ $packageId $expectedVersion is available on NuGet.org"
              } else {
                Write-Host "⚠ $packageId $expectedVersion not yet published (available: $($response.versions -join ', '))"
                $allAvailable = $false
              }
            } catch {
              Write-Host "⚠ $packageId not found on NuGet.org (package may not be published yet)"
              $allAvailable = $false
            }
          }
          if ($allAvailable) {
            Write-Host "`n✓ All required packages available"
            echo "available=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "`n⚠ Some packages not yet available"
            echo "available=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build with NuGet packages
        if: steps.check-nuget.outputs.available == 'true'
        shell: pwsh
        run: |
          Write-Host "Building with UseNuGetPackages=true (NuGet package available)"
          dotnet restore src/Tidalarr/Tidalarr.csproj -p:UseNuGetPackages=true
          dotnet build src/Tidalarr/Tidalarr.csproj -c Release -p:UseNuGetPackages=true --no-restore

      - name: Skip NuGet build (package not published)
        if: steps.check-nuget.outputs.available != 'true'
        shell: pwsh
        run: |
          Write-Host "::notice::SKIPPED: NuGet package path validation skipped - Lidarr.Plugin.{Abstractions,Common} 1.5.0 not yet published to NuGet.org"
          Write-Host "This job will automatically start validating once v1.5.0 is released."
