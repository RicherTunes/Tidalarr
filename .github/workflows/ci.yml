name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Gitleaks secret scan
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Gitleaks secret scan
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  lint:
    name: Common lint gates
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_VERSION: 8.0.x
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init Common submodule
        uses: ./.github/actions/init-common-submodule
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.CI_PAT }}

      - name: Common submodule pin guard
        shell: bash
        run: bash ext/Lidarr.Plugin.Common/scripts/repin-common-submodule.sh --verify-only --path ext/Lidarr.Plugin.Common

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Common lint gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-FallbackGate {
            param([string]$ScriptPath, [string[]]$Arguments)
            if (-not (Test-Path $ScriptPath)) {
              Write-Error "Fallback lint gate script not found: $ScriptPath"
              exit 1
            }
            $global:LASTEXITCODE = 0
            & $ScriptPath @Arguments
            $gateExitCode = if ($null -eq $global:LASTEXITCODE) { 0 } else { [int]$global:LASTEXITCODE }
            if ($gateExitCode -ne 0) { exit $gateExitCode }
          }

          $runner = './ext/Lidarr.Plugin.Common/scripts/ci/run-plugin-lint-gates.ps1'
          if (Test-Path $runner) {
            $global:LASTEXITCODE = 0
            & $runner -RepoPath . -CommonRoot ext/Lidarr.Plugin.Common -Mode ci
            $runnerExitCode = if ($null -eq $global:LASTEXITCODE) { 0 } else { [int]$global:LASTEXITCODE }
            exit $runnerExitCode
          }

          Write-Warning "Shared lint runner not found; using compatibility fallback until Common submodule is repinned."
          Invoke-FallbackGate './ext/Lidarr.Plugin.Common/scripts/lint-date-parsing.ps1' @('-Path', '.', '-Mode', 'ci')
          Invoke-FallbackGate './ext/Lidarr.Plugin.Common/scripts/lint-sync-over-async.ps1' @('-Path', '.', '-Mode', 'ci')
          Invoke-FallbackGate './ext/Lidarr.Plugin.Common/scripts/ecosystem-parity-lint.ps1' @('-RepoPath', '.', '-CommonRoot', 'ext/Lidarr.Plugin.Common', '-Check', 'VersionContract', '-Mode', 'ci')

  verify:
    name: Full local-ci verification
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [lint, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_VERSION: 8.0.x
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init Common submodule
        uses: ./.github/actions/init-common-submodule
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.CI_PAT }}

      - name: Common submodule pin guard
        shell: bash
        run: bash ext/Lidarr.Plugin.Common/scripts/repin-common-submodule.sh --verify-only --path ext/Lidarr.Plugin.Common

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Full local-ci verification
        shell: pwsh
        run: ./scripts/verify-local.ps1
