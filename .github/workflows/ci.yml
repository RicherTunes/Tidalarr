name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: false

      - name: Init required submodule (Common only)
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Setup .NET SDKs
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x

      - name: Formatting check (repo-only)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # Format check individual projects to avoid dependency on external Lidarr assemblies
          # HostBridge is excluded as it requires Lidarr.Core/Common which are downloaded by ci.ps1
          dotnet format src/Tidalarr/Tidalarr.csproj --verify-no-changes -v minimal
          dotnet format tests/Tidalarr.Tests/Tidalarr.Tests.csproj --verify-no-changes -v minimal
          dotnet format TidalCLI/TidalCLI.csproj --verify-no-changes -v minimal

      - name: Run unified plugin pipeline
        shell: pwsh
        run: ./scripts/ci.ps1


