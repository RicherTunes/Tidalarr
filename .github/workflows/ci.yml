name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.3.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - name: Init required submodule (Common only)
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Setup .NET SDKs
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Formatting check (repo-only)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet format Tidalarr.sln --verify-no-changes -v minimal --exclude ext --exclude temp

      - name: Run unified plugin pipeline
        shell: pwsh
        run: ./scripts/ci.ps1


