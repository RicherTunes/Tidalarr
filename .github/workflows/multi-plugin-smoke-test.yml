name: 🔥 Multi-Plugin Smoke Test
# Triggered by push/PR or manual dispatch

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Tidalarr/**'
      - '.github/workflows/multi-plugin-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Tidalarr/**'
      - '.github/workflows/multi-plugin-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: 🔥 Plugin Co-existence
    uses: RicherTunes/Lidarr.Plugin.Common/.github/workflows/multi-plugin-smoke-test.yml@405544e7e949ca00739499ac22fdb2b7a83cf328
    with:
      caller_plugin: tidalarr
      test_plugins: 'brainarr,qobuzarr,tidalarr,applemusicarr'
      lidarr_tag: 'pr-plugins-3.1.2.4913'
    secrets: inherit


