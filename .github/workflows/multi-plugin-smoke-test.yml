# PR E2E - hermetic mode with authfail-redaction gate
# Fast, cheap, no live credentials required
# Runs: basic gate + authfail-redaction gate
# Does NOT run: medium, search, grab, golden-persist (require live credentials)
# See e2e-nightly.yml for full live E2E suite

name: E2E PR Check

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Tidalarr/**'
      - '.github/workflows/multi-plugin-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Tidalarr/**'
      - '.github/workflows/multi-plugin-smoke-test.yml'
  workflow_dispatch:

# Prevent multiple PR E2E runs from piling up (billing control)
concurrency:
  group: e2e-pr-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  hermetic-e2e:
    name: Hermetic E2E
    timeout-minutes: 20
    uses: RicherTunes/Lidarr.Plugin.Common/.github/workflows/e2e-pr-hermetic.yml@main
    with:
      test_plugins: 'qobuzarr,tidalarr'
      caller_plugin: 'tidalarr'
      lidarr_tag: 'pr-plugins-3.1.1.4884'
    secrets:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
