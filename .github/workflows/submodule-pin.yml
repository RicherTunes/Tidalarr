name: Submodule Pinning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-submodule-sha:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        # actions/checkout v4.3.0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - name: Ensure Common submodule at indexed commit
        shell: pwsh
        run: |
          git config --local url.https://github.com/.insteadOf git@github.com:
          git config --local url.https://x-access-token:$env:GH_TOKEN@github.com/.insteadOf https://github.com/
          git submodule sync -- ext/Lidarr.Plugin.Common
          git submodule update --init --recursive --depth=1 -- ext/Lidarr.Plugin.Common

      - name: Verify ext/Lidarr.Plugin.Common SHA or Tag
        shell: pwsh
        run: |
          $expected = (Get-Content "$env:GITHUB_WORKSPACE/ext-common-sha.txt").Trim()
          if (-not $expected) { Write-Error "ext-common-sha.txt is empty"; exit 1 }
          # Resolve expected to a commit (supports tags like v1.2.1 or raw SHA)
          if ($expected -match '^v\d+\.\d+\.\d+(?:[-\.][A-Za-z0-9]+)?$') {
            $url = git config -f .gitmodules --get submodule.ext/Lidarr.Plugin.Common.url
            if (-not $url) { Write-Error 'Submodule URL not found'; exit 1 }
            $remote = git ls-remote --tags $url $expected
            if (-not $remote) { Write-Error "Tag $expected not found on $url"; exit 1 }
            $expectedSha = ($remote -split '\s+')[0]
          } else {
            $expectedSha = $expected
          }
          $ls = git ls-tree HEAD ext/Lidarr.Plugin.Common
          if (-not $ls) { Write-Error "Failed to read submodule tree entry"; exit 1 }
          $actual = ($ls -split '\s+')[2]
          if (-not $actual) { Write-Error "Failed to parse submodule SHA from: $ls"; exit 1 }
          if (-not $actual.StartsWith($expectedSha.Substring(0,7))) {
            Write-Error "Submodule mismatch. Expected $expected ($expectedSha), found $actual"
            exit 1
          }
          Write-Host "Submodule OK: $actual matches $expected"
