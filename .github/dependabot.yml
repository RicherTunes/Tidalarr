version: 2
updates:
  # Enable version updates for .NET/NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    reviewers:
      - "richertunes"
    assignees:
      - "richertunes"
    labels:
      - "dependencies"
      - "automated"
      - "nuget"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    ignore:
      # Host-boundary packages: types cross plugin<->host boundary via NzbDrone APIs.
      # ANY version change causes type-identity conflicts at runtime.
      # Only bump when the Lidarr host itself upgrades first.
      - dependency-name: "NLog"
        versions: [">=5.5.0"]
      - dependency-name: "FluentValidation"
        versions: [">=12.0.0"]
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
        versions: [">=9.0.0"]
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
        versions: [">=9.0.0"]
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        versions: [">=9.0.0"]
      - dependency-name: "System.Text.Json"
        versions: [">=9.0.0"]
    allow:
      # Allow all dependency types
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # Submodule updates
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    target-branch: "main"
    reviewers:
      - "richertunes"
    assignees:
      - "richertunes"
    labels:
      - "dependencies"
      - "automated"
      - "submodule"
    commit-message:
      prefix: "deps(submodule)"
      include: "scope"
